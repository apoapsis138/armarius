name: Bug report
description: Something in Armarius is broken, or doesn't match the book.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The repository is public, so anything you
        write or attach can be seen by anyone. Attach an Export of just the
        records involved, never your whole saga file. If someone could see or
        change what they shouldn't, don't post it here: use the Security tab's
        "Report a vulnerability".
        [How to report a bug](https://apoapsis138.github.io/armarius/help/guide-report-bug/)
        has more help.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the saga…
        2. Go to …
        3. Press …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: On the title page or Help's About page.
      placeholder: "4.13.0"
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: >-
        Whatever helps: where it runs (Desktop app, Terminal app, hosted saga,
        Docker), your operating system, any error text or crash.log from your
        save folder, or, for a rules bug, the book and printed page.
    validations:
      required: false
