# The user-docs website (https://apoapsis138.github.io/armarius/), built
# from site/ and the app's help by tools/build_site.py and published to
# GitHub Pages. main changes only through a release, so the site follows
# each release; it can also be run by hand (Actions tab -> Pages -> Run
# workflow). Settings -> Pages -> Source must be "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and the site's tools
        run: uv sync --locked --no-default-groups --group site
      - uses: actions/configure-pages@v5
      - name: Build the site
        run: uv run --no-sync python tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
