# The user-docs website (https://apoapsis138.github.io/armarius/), built
# from site/ and the app's help by tools/build_site.py and published to
# GitHub Pages. It is built when a version tag (vX.Y.Z) is pushed, beside
# the Release and the container image, so the site matches the latest
# release rather than whatever is on main; it can also be run by hand
# (Actions tab -> Pages -> Run workflow). Settings -> Pages -> Source must
# be "GitHub Actions", and the github-pages environment must allow
# deployments from tags matching v*.*.*.
name: Pages

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and the site's tools
        run: uv sync --locked --no-default-groups --group site
      - uses: actions/configure-pages@v5
      - name: Build the site
        run: uv run --no-sync python tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
