# Publishes the headless host's container image (deploy/Dockerfile) when a
# version tag (vX.Y.Z) is pushed, beside the Release that release.yml
# makes: ghcr.io/apoapsis138/armarius:X.Y.Z, for amd64 (a NAS on an Intel
# or AMD chip, most servers) and arm64 (a Raspberry Pi, an ARM server).
# Only the version tag is pushed, never "latest": a host moves to a newer
# version on purpose (ADR 0022).
name: Image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check the tag against pyproject.toml and main
        run: |
          version="${TAG#v}"
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$version" != "$project" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml's version $project"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/apoapsis138/armarius:${{ env.VERSION }}
          labels: org.opencontainers.image.version=${{ env.VERSION }}
