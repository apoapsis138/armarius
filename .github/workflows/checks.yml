# The checks every change must pass (CONTRIBUTING.md), on clean Windows and
# Linux machines: formatting, lint and types once per system, and the full
# test suite split four ways per system (pytest --shard, tools/shards.py),
# the eight quarters running side by side. They run on every push and pull
# request to main (the one long-lived branch, always releasable), and by
# hand from the Actions tab.
#
# A pull request that changes only the docs-only files below (the `changes`
# job) runs the fast tier instead of the full suite (`-m "not ui"`, once per
# system); lint, format and types still run. Pushes to main and runs by
# hand always run the full suite. Changelog fragments (changelog.d/*.md)
# count as docs: the fast tier checks them. NOTICE.md and docs/screenshots/
# are left off the list on purpose: tests read NOTICE.md, and the help
# site copies the screenshots.
#
# The last job, `checks`, passes only when all the others that should run
# did: it is the one status branch protection requires.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Is this a docs-only pull request?
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
            echo "Changed files:"
            echo "$files"
            if [ -n "$files" ]; then
              docs_only=true
              while IFS= read -r f; do
                case "$f" in
                  docs/screenshots/*) docs_only=false ;;
                  README.md | CONTRIBUTING.md | SECURITY.md | docs/* | .github/ISSUE_TEMPLATE/* | changelog.d/*.md) ;;
                  *) docs_only=false ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "docs_only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run pyright

  tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        shard: [1, 2, 3, 4]
    name: tests (${{ matrix.os }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    # A quarter of the suite takes about 5-10 minutes on a 4-core runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      # A failed test is run once more alone (tools/ci_tests.py): one that
      # passes then is flaky, and the job stays green but warns of it on
      # the pull request and in the job's summary; one that fails again,
      # or a collection or setup error, fails the job.
      - name: Tests (shard ${{ matrix.shard }} of 4)
        run: uv run python tools/ci_tests.py -q -n auto --dist worksteal --shard=${{ matrix.shard }}/4

  # A docs-only pull request's lighter run: the fast tier, no screen tests.
  fast-tests:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Tests (fast tier)
        run: uv run pytest -q -n auto --dist worksteal -m "not ui"

  checks:
    if: always()
    needs: [changes, lint, tests, fast-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that should run passed
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          FAST: ${{ needs.fast-tests.result }}
        run: |
          echo "changes: $CHANGES (docs only: $DOCS_ONLY), lint: $LINT, tests: $TESTS, fast tests: $FAST"
          test "$CHANGES" = success && test "$LINT" = success || exit 1
          if [ "$DOCS_ONLY" = true ]; then
            # The full suite was skipped on purpose; the fast tier stands in.
            test "$FAST" = success && test "$TESTS" = skipped
          else
            test "$TESTS" = success
          fi
