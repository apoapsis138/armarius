# The checks run before every story is handed over (CLAUDE.md), on a clean
# machine, for every push to main and every pull request (STORY-1127).
# Windows, like the machine the app is used on; GitHub counts its minutes
# double against a private repo's free allowance.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q -n auto --dist worksteal
