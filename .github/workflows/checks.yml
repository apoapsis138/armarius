# The checks run before every story is handed over (CLAUDE.md), on a clean
# machine. Run by hand only (Actions tab -> Checks -> Run workflow): Hedda
# parked automatic runs on push on 2026-10-05, since every story already runs
# them locally and a Windows run bills ~40 of the free private-repo minutes.
# See "Automated GitHub checks (CI)" in the kanban Ideas column.
name: Checks

on:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q -n auto --dist worksteal
