[project]
name = "armarius-style"
version = "1.0.0"
description = "The Scriptorum look of Armarius: palettes, Textual themes, Qt ornaments and fonts."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.14"
authors = [{ name = "apoapsis" }]
dependencies = []

[project.optional-dependencies]
terminal = ["textual>=8.2.8"]
desktop = ["pyside6-essentials>=6.12"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.16.8", "pyright>=1.1.414"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
reportMissingParameterType = "error"
include = ["src"]
typeCheckingMode = "basic"
