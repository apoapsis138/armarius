[project]
name = "ars-magica-manager"
version = "1.2.2"
description = "A GM-facing management tool for Ars Magica 5th Edition covenants, characters, laboratories, and libraries."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.14"
dependencies = [
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.414",
    "pytest-xdist>=3.8.0",
]

[tool.ruff.lint]
ignore = ["UP045", "ISC004"]

[tool.pyright]
include = ["ars_magica_manager", "tools", "main.py"]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[tool.pytest.ini_options]
pythonpath = [".", "tools"]
asyncio_mode = "auto"
