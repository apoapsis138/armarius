[project]
name = "ars-magica-manager"
version = "3.90.1"
description = "Armarius, a saga manager for Ars Magica: a GM-facing tool for Ars Magica 5th Edition covenants, characters, laboratories, and libraries."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.14"
authors = [{ name = "apoapsis" }]
keywords = ["ars magica", "rpg", "tabletop", "campaign manager", "textual", "tui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "aiohttp>=3.14.4",
    "asyncssh>=2.24.1",
    "cryptography>=50.0.2",
    "keyring>=25",
    "platformdirs>=4.11.9",
    "textual>=8.2.8",
    "textual-serve>=1.1.3",
]

[project.urls]
Repository = "https://github.com/apoapsis138/Ars-Magica-Manager"
Changelog = "https://github.com/apoapsis138/Ars-Magica-Manager/blob/main/CHANGELOG.md"

[dependency-groups]
charges = [
    "shapely>=2.1",
]
catalog = [
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
]
dev = [
    "ruff>=0.16.8",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.414",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3",
    # The desktop version is type-checked and tested with the rest.
    {include-group = "gui"},
]
gui = [
    "pyside6-essentials>=6.12",
]

[tool.ruff.lint]
# TRY004: data of the wrong shape read from a save raises ValueError, as
# loading does, so one handler covers a damaged file (CLAUDE.md).
ignore = ["UP045", "ISC004", "TRY004"]
# Too many statements in one function (default limit 50). The functions
# already over it carry a noqa until they are broken up.
extend-select = ["PLR0915"]

[tool.pyright]
reportMissingParameterType = "error"
include = ["ars_magica_manager", "tools", "main.py"]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[tool.pytest.ini_options]
pythonpath = [".", "tools"]
asyncio_mode = "auto"
# A test that hangs fails after this long, with every thread's stack, instead
# of holding the run (a deadlock between two threads shows where each waits).
timeout = 300
timeout_method = "thread"
