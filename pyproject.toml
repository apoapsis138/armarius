[project]
name = "ars-magica-manager"
version = "4.14.0"
description = "Armarius, a saga manager for Ars Magica: a GM-facing tool for Ars Magica 5th Edition covenants, characters, laboratories, and libraries."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.14"
authors = [{ name = "apoapsis" }]
keywords = ["ars magica", "rpg", "tabletop", "campaign manager", "textual", "tui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "aiohttp>=3.14.4",
    "asyncssh>=2.24.1",
    "cryptography>=50.0.2",
    "keyring>=25",
    "platformdirs>=4.11.9",
    "textual>=8.2.8",
    "textual-serve>=1.1.3",
]

[project.urls]
Repository = "https://github.com/apoapsis138/Armarius"
Changelog = "https://github.com/apoapsis138/Armarius/blob/main/CHANGELOG.md"

[dependency-groups]
build = [
    "pyinstaller>=6.22",
]
dev = [
    "ruff>=0.16.8",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.414",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3",
    # The changelog's fragments (changelog.d/), built into CHANGELOG.md at
    # a release.
    "towncrier>=26.9.0",
    # The desktop version is type-checked and tested with the rest.
    {include-group = "gui"},
]
gui = [
    "pyside6-essentials>=6.12",
]
# The user-docs website (tools/build_site.py): only the Pages workflow and
# whoever builds the site locally need it.
site = [
    "mkdocs-material>=9.6",
]

[tool.ruff.lint]
# TRY004: data of the wrong shape read from a save raises ValueError, as
# loading does, so one handler covers a damaged file (CONTRIBUTING.md).
ignore = ["UP045", "ISC004", "TRY004"]
# Too many statements in one function (default limit 50). The functions
# already over it carry a noqa until they are broken up.
extend-select = ["PLR0915"]

[tool.pyright]
# The project's own environment, so an editor's pyright sees the same
# libraries as `uv run pyright` (and stops calling them missing).
venvPath = "."
venv = ".venv"
reportMissingParameterType = "error"
include = ["ars_magica_manager", "tools", "main.py"]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[tool.pytest.ini_options]
pythonpath = [".", "tools"]
asyncio_mode = "auto"
# A test that hangs fails after this long, with every thread's stack, instead
# of holding the run (a deadlock between two threads shows where each waits).
timeout = 300
timeout_method = "thread"

# The changelog is built from fragments (docs/adr/0026): each change adds a
# file to changelog.d/ named <slug>.<feature>.md, one entry each, and a
# release runs `towncrier build`, which writes them into CHANGELOG.md as the
# version's "## X.Y.Z — date" section and deletes them (changelog.d/README.md).
# One fragment type per feature in CHANGELOG.md's Features table, in its
# order, shown under the feature's Latin name; tests/test_changelog.py holds
# the two to each other.
[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
template = "changelog.d/template.md.jinja"
title_format = "## {version} — {project_date}"
underlines = ["", "", ""]
ignore = ["README.md", "template.md.jinja"]
issue_format = ""
wrap = false
all_bullets = true

[[tool.towncrier.type]]
directory = "pagina"
name = "Pagina"
showcontent = true

